  augment: true
  batch_size: 2
  lr: 0.0001
  weight_decay: 0.01
  grad_clip: 1.0
  log_every: 50
  num_workers: 2
  box_aug_p: 0.5
  seg_dir: data/seg
  bg_dir: data/backgrounds_sdxl
  box_t_min_frac: 0.5
  alpha_erode: 3
reg:
