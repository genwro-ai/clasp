seed: 2024
resolution: 1024
weight_dtype: bf16
sd_model_id: stabilityai/stable-diffusion-xl-base-1.0
output_dir: ./outputs/sdxl_bench10
hyper:
  rank: 4
  head_hidden: 50
  alpha_init: 1.0
  learn_alpha: true
task_cond:
  enabled: true
  key_dim: 256
  ground_cond: true
  ground_gsa: true
token_mask_lora: true
target_modules:
- attn2.to_q
- attn2.to_k
- attn2.to_v
- attn2.to_out.0
concepts:
